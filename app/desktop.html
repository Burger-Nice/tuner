<!doctype html>
<html lang="en" class="desktop">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>airglow</title>
<link rel="preload" href="tv/brand/fonts/outfit-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="tv/brand/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tv/brand/fonts.css">

</head>
<body>
<!-- airglow for Windows (design/ui-v1/desktop-v1/SPEC.md): the title bar, the sidebar, the pages, the player's stage,
     and the floating layers (float.js: mirrored to the overlay window while a picture is on screen) -->
<div id="dk">
  <header id="dk-tbar" class="tbar"></header>
  <nav id="dk-side" class="side"></nav>
  <main id="dk-pages"></main>
  <div id="dk-player" hidden></div>
</div>
<div id="floats" class="floats"></div>
<div id="floats-mini" class="floats"></div>
<!-- the TV's view modules expect their frame: kept here, hidden, so the data modules they share load as they are -->
<div id="tvstub" hidden aria-hidden="true"><div id="app"><div id="topbar"></div><div id="screens"></div><div id="overlays"></div><div id="toast"></div></div></div>
<script src="vendor/sentry.js"></script>
<script src="tv/js/report-scrub.js"></script>
<script src="tv/js/report-boot.js"></script>
<script src="titles.js"></script>
<script src="core.js"></script>
<script src="nba.js"></script>
<script type="module" src="desktop/main.js"></script>
</body>
</html>
