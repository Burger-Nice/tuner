# airglow accounts (design/ui-v1/accounts-v1/SPEC.md 7). Deployed by CI's `accounts` job; the database id is filled
# in there. The name is never changed casually: renaming or deleting the Worker loses its PEPPER, and then nobody can
# sign in again (NEXT.md).
name = "acct"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "pages"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/tv/*"]

[[d1_databases]]
binding = "DB"
database_name = "airglow"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_SYNC"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_POLL"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["17 4 * * *"]

[vars]
OPEN_SIGNUP = "false"
INVITES_PER_MONTH = "10"
