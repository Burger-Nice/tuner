<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Use your recovery key · airglow</title>
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/acct.css"></head>
<body><main data-page="recover">
<img class="logo" src="/lockup.svg" alt="airglow">
<h1>Use your recovery key</h1>
<p class="lead">Your email, the 20 characters from when you made the account, and a new password. Every device signs out and asks again.</p>
<form id="f" autocomplete="on">
  <label for="email">Email</label><div class="field"><input id="email" type="email" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username"></div>
  <label for="rkey">Recovery key</label><div class="field code"><input id="rkey" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off"></div>
  <label for="pw">New password · 12 characters or more</label><div class="field"><input id="pw" type="password" autocomplete="new-password"><button type="button" id="show">Show</button></div>
  <div class="err" id="err" hidden></div>
  <button class="pill" id="go" type="submit">Set the new password</button>
</form>
<div class="done" id="done" hidden><b>Done.</b> Sign in with the new password in the app. Then make a new recovery key in Account: the old one was just typed somewhere.</div>
</main><script type="module" src="/acct.js"></script></body></html>
