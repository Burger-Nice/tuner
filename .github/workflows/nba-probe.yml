name: NBA feed probe
on:
  push:
    paths: ['scripts/nba-probe.js', '.github/workflows/nba-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/nba-probe.js
