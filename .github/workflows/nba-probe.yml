name: NBA feed probe
on:
  push:
    paths: ['scripts/nba-probe.js', '.github/workflows/nba-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/nba-probe.js
      - name: Save as a test fixture release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf nba-fixtures.tgz fixtures
          gh release delete nba-fixtures --yes --cleanup-tag || true
          gh release create nba-fixtures nba-fixtures.tgz --prerelease --latest=false --title "NBA test data" --notes "Raw ESPN feeds used to test Tuner's NBA screens. Not an app release."
