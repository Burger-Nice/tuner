name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (downloads mpv)
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make sure mpv is there
        shell: pwsh
        run: if (!(Test-Path vendor/mpv/mpv.exe)) { throw "mpv.exe was not downloaded" }

      - name: Set version
        shell: pwsh
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run dist

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/Tuner.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0) { throw "Smoke test failed" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          # The very first build used a release called "latest"; the app now looks for versioned releases.
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create "v$v" dist/Tuner-Setup.exe dist/Tuner-Setup.exe.blockmap dist/latest.yml --title "Tuner $v" --notes "Built from $env:GITHUB_SHA. Tuner updates itself; new installs use Tuner-Setup.exe." --latest
