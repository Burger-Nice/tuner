name: Build Tuner

on:
  push:
    branches: [main]
    paths-ignore: ['scripts/nba-probe.js', '.github/workflows/nba-probe.yml', 'design/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  # <stage>.<build>: the middle number goes up with each big release (0.3: catch-up, subtitles, add-ons); the last is
  # the build's run number, which also orders the updates (the TV compares the run number, never the name)
  VERSION: 0.4.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Install (downloads mpv)
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Make sure mpv is there
        shell: pwsh
        run: if (!(Test-Path vendor/mpv/mpv.exe)) { throw "mpv.exe was not downloaded" }
      - name: Set version
        run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
      - name: Build installer
        run: npm run dist
      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/Tuner.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0) { throw "Smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Tuner-Setup.exe
            dist/Tuner-Setup.exe.blockmap
            dist/latest.yml

  test-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: sh tests/make-media.sh tests/media
      - uses: actions/upload-artifact@v4
        with: { name: test-media, path: tests/media }

  ios:
    runs-on: macos-15
    needs: test-media
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the iPhone app (unsigned; AltStore signs it; app/phone.html + app/phone/, design/ui-v1/phone-v1)
        run: |
          set -o pipefail
          node scripts/build-web.js phone
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 25
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Tuner.ipa Payload
          ls -la Tuner.ipa
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Tuner.ipa }

      - uses: actions/download-artifact@v4
        with: { name: test-media, path: tests/media }
      - name: Test in the iPhone simulator
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          TUNER_TEST=tests/ios-test-boot.js node scripts/build-web.js phone
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim build | tail -n 15
          MEDIA_DIR=tests/media node tests/mock-provider.js > mock.log 2>&1 &
          DEV=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices; const all=Object.entries(d).filter(([k])=>k.includes('iOS')).flatMap(([,v])=>v).filter(x=>/^iPhone \d+( Pro)?$/.test(x.name)); console.log((all.find(x=>/Pro$/.test(x.name))||all[0]).udid)")
          echo "Simulator: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" build/sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" app.tuner.player
          node tests/ios-shots.js | while read -r line; do echo "::notice title=iPhone test::$line"; done
          tar czf ios-test-shots.tgz ios-shots
          gh release delete ios-test --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-test ios-test-shots.tgz --prerelease --latest=false --title "iPhone simulator test" --notes "Screenshots from the iPhone simulator test of $GITHUB_SHA. Not an app release."
      # The simulator test's own verdict (the step above always looks green): it finished, and every check passed.
      - name: Check the simulator test's results
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('ios-shots/reports.json')) { console.log('::error title=iPhone test::no reports (the test did not run)'); process.exit(1); }
            const r = JSON.parse(fs.readFileSync('ios-shots/reports.json', 'utf8'));
            const checks = r.filter((x) => x.step === 'check'), bad = checks.filter((x) => !x.data.ok);
            for (const x of checks) console.log((x.data.ok ? 'OK   ' : 'FAIL ') + x.data.name + (x.data.detail ? ' · ' + x.data.detail : ''));
            for (const x of bad) console.log('::error title=iPhone check failed::' + x.data.name + ' ' + (x.data.detail || ''));
            for (const x of r.filter((x) => x.step === 'error')) console.log('::warning title=iPhone page error::' + String(x.data).slice(0, 300));
            console.log(checks.length + ' checks, ' + bad.length + ' failed' + (r.some((x) => x.step === 'done') ? '' : ', the test did not finish'));
            if (bad.length || !r.some((x) => x.step === 'done') || !checks.length) process.exit(1);
          "

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TUNER_KEY_PASSWORD: ${{ secrets.TUNER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Signing key
        id: key
        run: |
          if [ -z "$TUNER_KEY_PASSWORD" ]; then
            echo "::warning title=Android signing::Add a repository secret named TUNER_KEY_PASSWORD so the TV app can be signed and updated. Until then the APK is built and tested but not published."
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/tuner.keystore"
          if [ -f android/tuner-release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/tuner-release.keystore.enc -out "$KS" -pass env:TUNER_KEY_PASSWORD
          else
            # First signed build: make the key once, and keep only an encrypted copy in the repo.
            keytool -genkeypair -keystore "$KS" -alias tuner -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$TUNER_KEY_PASSWORD" -keypass "$TUNER_KEY_PASSWORD" -dname "CN=Tuner"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -in "$KS" -out android/tuner-release.keystore.enc -pass env:TUNER_KEY_PASSWORD
            git config user.name "Tuner build"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/tuner-release.keystore.enc
            git commit -m "Store the encrypted Android signing key [skip ci]"
            git push
          fi
          echo "TUNER_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "signed=yes" >> "$GITHUB_OUTPUT"
      - name: Build the Google TV app
        run: |
          node scripts/build-web.js tv
          npx cap sync android
          cd android
          # Surface compiler errors as annotations (the raw log isn't always easy to get to).
          if ! ./gradlew assembleRelease --no-daemon -PtunerVersionCode=${{ github.run_number }} -PtunerVersionName=$VERSION > gradle.log 2>&1; then
            grep -E "error:|e: |What went wrong|FAILURE|Could not|> " gradle.log | head -40 | sed 's/^/::error title=Android build::/'
            tail -25 gradle.log | sed 's/^/::error title=Android build tail::/'
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Tuner-TV.apk
          # Same file under the old name, so the first Downloader link keeps working.
          cp ../Tuner-TV.apk ../Tuner.apk
          ls -la ../Tuner-TV.apk
      - if: steps.key.outputs.signed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Tuner-TV.apk
            Tuner.apk


  android-test:
    # Separate from the release so a stuck emulator can never hold up the TV app.
    runs-on: ubuntu-latest
    needs: test-media
    timeout-minutes: 47
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: test-media, path: tests/media }
      - name: Build the test version
        run: |
          TUNER_TEST=tests/android-test-boot.js TUNER_TEST_API=http://10.0.2.2:8899 node scripts/build-web.js tv
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q -PtunerVersionCode=${{ github.run_number }} -PtunerVersionName=$VERSION
      - name: Start the fake provider
        run: MEDIA_DIR=tests/media nohup node tests/mock-provider.js > mock.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the Android TV emulator
        continue-on-error: true
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.build.characteristics | sed 's/^/::notice title=TV test::device type /'
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb shell svc power stayon true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | tail -2 | sed 's/^/::notice title=TV test::install /'
            adb logcat -c
            adb shell am start -W -n app.tuner.player/.MainActivity 2>&1 | sed 's/^/::notice title=TV test::start /'
            sleep 12
            adb shell pidof app.tuner.player | sed 's/^/::notice title=TV test::running pid /'
            adb logcat -d -b crash 2>&1 | head -40 | sed 's/^/::notice title=TV crash::/'
            adb logcat -d 2>&1 | grep -E "FATAL|AndroidRuntime|Capacitor/Console|chromium.*CONSOLE|E Capacitor" | head -40 | sed 's/^/::notice title=TV log::/'
            node tests/android-shots.js 2>&1 | sed 's/^/::notice title=TV test::/'
            adb logcat -d 2>&1 | grep -E "FATAL|AndroidRuntime|TunerPlayer|ExoPlayer|Capacitor/Console" | tail -40 | sed 's/^/::notice title=TV log end::/'
      # The test's own verdict: it finished, and every check passed (the emulator step above always looks green).
      - name: Check the emulator test's results
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('android-shots/reports.json', 'utf8'));
            const checks = r.filter((x) => x.step === 'check'), bad = checks.filter((x) => !x.data.ok);
            for (const x of bad) console.log('::error title=TV check failed::' + x.data.name + ' [' + (x.data.focus || '') + ']');
            for (const x of r.filter((x) => x.step === 'error')) console.log('::warning title=TV page error::' + String(x.data).slice(0, 300));
            console.log(checks.length + ' checks, ' + bad.length + ' failed' + (r.some((x) => x.step === 'done') ? '' : ', the test did not finish'));
            if (bad.length || !r.some((x) => x.step === 'done')) process.exit(1);
          "
      - name: Share the test screenshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d android-shots ] || exit 0
          tar czf android-test-shots.tgz android-shots
          gh release delete android-test --yes --cleanup-tag 2>/dev/null || true
          gh release create android-test android-test-shots.tgz --prerelease --latest=false --title "Android TV emulator test" --notes "Screenshots from the Android TV emulator test of $GITHUB_SHA. Not an app release."

  # PC and TV go out as soon as they're built; the iPhone build joins the same release when it's done.
  release:
    runs-on: ubuntu-latest
    needs: [windows, android]
    # Only main becomes a version; running the workflow on another branch builds and tests it without publishing.
    if: always() && needs.windows.result == 'success' && github.ref == 'refs/heads/main'
    outputs:
      ship: ${{ steps.what.outputs.ship }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # A push that only changes tests, docs or CI is still built and tested, but doesn't become a new version
      # (run the workflow by hand to publish anyway).
      - name: Anything to ship?
        id: what
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$before^{commit}" 2>/dev/null \
             && ! git diff --name-only "$before" HEAD | grep -qvE '^(tests/|design/|\.github/|README\.md$)'; then
            echo "ship=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::Only tests, docs or CI changed, so no new version was published."
          else
            echo "ship=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.what.outputs.ship == 'yes'
        uses: actions/download-artifact@v4
        with: { name: windows, path: out }
      - if: steps.what.outputs.ship == 'yes'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: android, path: out }
      - name: Update manifest
        if: steps.what.outputs.ship == 'yes'
        run: if [ -f out/Tuner-TV.apk ]; then node scripts/android-manifest.js "$VERSION" "${{ github.run_number }}" out/android.json; fi
      - name: Publish release
        if: steps.what.outputs.ship == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create "v$VERSION" out/* --title "airglow $VERSION" --latest \
            --notes "Built from $GITHUB_SHA. The Google TV app (airglow) and the PC app update themselves. iPhone: add the AltStore source ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/altstore-source.json"

  release-ios:
    runs-on: ubuntu-latest
    needs: [ios, release]
    if: always() && needs.release.result == 'success' && needs.release.outputs.ship == 'yes'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: ios, path: out }
      - name: Add the iPhone app to the release
        run: |
          mkdir -p out
          if [ -f out/Tuner.ipa ]; then
            node scripts/altstore-source.js "$VERSION" "${{ github.run_number }}" out/Tuner.ipa out/altstore-source.json
            gh release upload "v$VERSION" out/Tuner.ipa out/altstore-source.json --clobber
          else
            # No new iPhone build: keep AltStore pointing at the last one that worked.
            prev=$(gh release list --limit 2 --json tagName --jq '.[1].tagName')
            gh release download "$prev" -p altstore-source.json -D out && gh release upload "v$VERSION" out/altstore-source.json --clobber
          fi
