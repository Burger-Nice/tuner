<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 100" width="84" height="100" role="img" aria-label="Tuner">
  <!-- Tuner mark v2.2 = the T of TUNER. The stem is the needle (full height, straight, 23 wide = wordmark stem) and it cuts the scale
