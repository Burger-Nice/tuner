<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0d0e12;color:#868d9b;font:11px system-ui,sans-serif;padding:24px;display:flex;gap:40px;align-items:flex-end}

.light{background:#f2f3f5;padding:24px;color:#555}

</style></head><body>

<div class="v" style="color:#f2f3f5"><img src="../lockup-mono.svg" width="240"><img src="../mark-mono.svg" width="48"><span style="color:#868d9b">mono on dark</span></div>
