<script src="../kit/art.js"></script><script src="../kit/data.js"></script><script src="../kit/kit.js"></script></head>
<body><div class="screen" id="s"></div><script>
const {ic,liveP,dot,topbar,cell,hm,pct,WIN,NOWH}=Kit, C=Mock.CHANNELS;
const prog={
 4:[['Grizzlies at Warriors',19.5,22,1],['NBA Postgame',22,22.5],['Hardwood Classics: Finals G6',22.5,24.5]],
 12:[['SportsCenter',20,21],['NFL Live',21,22],['Monday Night Countdown',22,23],['First Take',23,24]],
 33:[['Game Time',20,21],['Press Pass',21,21.5],['Hardwood Classics: Finals G6',21.5,23.5]],
 31:[['Lakers at Suns',20.5,23,1],['Inside the NBA',23,24]],
 101:[['Panorama',20.5,21],['Silent Witness',21,22],['Newsnight',22,23],['Question Time',23,24]],
 118:[['Premier League: Live',20,22.25,1],['Final Score',22.25,23],['Match of the Day',23,24]],
};
const rows=[C[0],C[1],C[3],C[2],C[4],C[5]];
function row(ch,i,focusIdx){
  const cells=prog[ch.n].map(([t,s,e,l],j)=>cell({t,s,e},{focus:i===0&&j===0,now:s<=NOWH&&e>NOWH,live:!!l&&s<=NOWH&&e>NOWH})).join('');
  return `<div class="g-row"><div class="g-ch${i===0?' sel':''}"><span class="num">${ch.n}</span><span class="logo sm">${ch.ini}</span><div class="nm">${ch.name}</div>${ch.fav?`<span class="fv">${ic('star')}</span>`:''}</div><div class="g-cells">${cells}</div></div>`;
}
const TW=660, CW=204;
const nowx=CW+TW*pct(NOWH)/100;
const ticks=[21,21.5,22,22.5,23].map(h=>`<span style="left:${pct(h)}%">${hm(h)}</span>`).join('');
document.getElementById('s').innerHTML=`
${topbar({sel:'live',live:true})}
<div class="g-now">
  <span class="logo lg">NBA</span>
  <div class="grow">
    <div class="row-flex" style="gap:12px"><span class="t-title" style="font-size:22px;line-height:26px">Grizzlies at Warriors</span>${liveP()}</div>
    <div class="row-flex t-cap" style="gap:0;margin-top:2px;color:var(--a-text-2);font-size:14px;line-height:20px">NBA League Pass 4${dot}19:30${dot}22:00${dot}1h 19m left<span class="prog" style="width:120px;margin-left:14px"><i style="width:63%"></i></span></div>
    <div class="clamp2" style="font:500 14px/20px var(--a-font-text);color:var(--a-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Western Conference opener. Memphis lead by seven after two quarters; Golden State are 0-1.</div>
  </div>
  <span class="btn">${ic('play','fill')}Watch</span><span class="btn2 icon">${ic('starO')}</span>
</div>
<div class="g-grid">
  <div class="g-ruler"><div class="g-corner"><span class="chip lg">${ic('list')}All channels<span class="t-3" style="font-weight:500">10</span></span></div><div class="g-time" style="margin-left:0">${ticks}</div></div>
  <div class="g-nowflag" style="left:${nowx-27}px">${hm(NOWH)}</div>
  ${rows.map(row).join('')}
  <div class="g-nowline" style="left:${nowx-1}px;height:338px"></div>
</div>`;
</script></body></html>
