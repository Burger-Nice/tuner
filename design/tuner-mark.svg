<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="92"><stop offset="0" stop-color="#ffb43e"/><stop offset=".42" stop-color="#ff3b30"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
  <radialGradient id="bg" cx=".5" cy=".55" r=".75"><stop offset="0" stop-color="#2b0d12"/><stop offset=".55" stop-color="#0c0b10"/><stop offset="1" stop-color="#050507"/></radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff3b30" stop-opacity=".55"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
  <linearGradient id="shL" x1="1" x2="0"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="shR" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <!-- scanline gaps, shared by every part of the T -->
  <mask id="scan" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <rect width="100" height="100" fill="#fff"/>
    <g fill="#000"><rect y="22.5" width="100" height="2.4"/><rect y="30.5" width="100" height="2.4"/><rect y="47" width="100" height="2.4"/><rect y="55" width="100" height="2.4"/><rect y="63" width="100" height="2.4"/><rect y="71" width="100" height="2.4"/><rect y="79" width="100" height="2.4"/></g>
  </mask>
  <g id="mark">
    <g mask="url(#scan)">
      <!-- arms (behind), slightly darker, tapered like a ribbon -->
      <path d="M11 16H50V41H16Z" fill="url(#g)"/><path d="M89 16H50V41H84Z" fill="url(#g)"/>
      <path d="M11 16H50V41H16Z M89 16H50V41H84Z" fill="#000" opacity=".08"/>
      <rect x="25" y="16" width="13" height="25" fill="url(#shL)"/><rect x="62" y="16" width="13" height="25" fill="url(#shR)"/>
      <!-- stem (on top), slanted cut -->
      <path d="M38 11H62V83L38 90Z" fill="url(#g)"/>
      <path d="M38 11H62V14H38Z" fill="#fff" opacity=".35"/>
    </g>
  </g>
  <g id="waves">
    <path d="M32.7 53A20 20 0 0 0 32.7 73M67.3 53A20 20 0 0 1 67.3 73" fill="none" stroke="#f4f5f8" stroke-width="4.2" stroke-linecap="round" opacity=".6"/>
    <path d="M24 48A30 30 0 0 0 24 78M76 48A30 30 0 0 1 76 78" fill="none" stroke="#f4f5f8" stroke-width="4.2" stroke-linecap="round" opacity=".26"/>
  </g>
  </defs><circle cx="50" cy="56" r="36" fill="url(#glow)"/><use href="#waves"/><use href="#mark"/></svg>
