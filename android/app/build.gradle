apply plugin: 'com.android.application'

android {
    namespace = "app.tuner.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.tuner.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes these; see .github/workflows/build.yml
        versionCode = (project.findProperty('tunerVersionCode') ?: '1').toInteger()
        versionName = (project.findProperty('tunerVersionName') ?: '0.0.0').toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Error reports (design/ui-v1/error-reports/SPEC.md D5): the address from reports.json for releases only (CI from main);
        // -PreportsDsn overrides it (the emulator test: the fake ingest), and a local debug build gets none (no native Sentry).
        def reportsJson = new groovy.json.JsonSlurper().parse(rootProject.file('../reports.json'))
        def reportsDsn = project.findProperty('reportsDsn') != null ? project.findProperty('reportsDsn').toString() : (project.findProperty('reportsEnv') == 'production' ? reportsJson.dsn : '')
        buildConfigField 'String', 'REPORTS_DSN', '"' + reportsDsn + '"'
        buildConfigField 'String', 'REPORTS_ENV', '"' + (project.findProperty('reportsEnv') ?: 'dev') + '"'
        buildConfigField 'String', 'GIT_SHA', '"' + ((System.getenv('GITHUB_SHA') ?: '').take(7)) + '"'
        buildConfigField 'boolean', 'REPORTS_TEST', project.hasProperty('reportsTest') ? 'true' : 'false'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // The signing key stays in a GitHub secret; every update must use the same key.
            if (System.getenv('TUNER_KEYSTORE')) {
                storeFile file(System.getenv('TUNER_KEYSTORE'))
                storePassword System.getenv('TUNER_KEY_PASSWORD')
                keyAlias 'tuner'
                keyPassword System.getenv('TUNER_KEY_PASSWORD')
            }
        }
    }
    buildFeatures { buildConfig true }
    lint {
        // Media3 marks parts of its API as 'unstable'; that's fine for this app.
        checkReleaseBuilds false
        abortOnError false
    }
    buildTypes {
        release {
            signingConfig System.getenv('TUNER_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    // error reports: Sentry's core Android SDK only (no NDK, no replay, no Gradle plugin: SPEC D2)
    implementation "io.sentry:sentry-android-core:8.63.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
